name: Push

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ forge.workflow }}-${{ forge.ref }}
  cancel-in-progress: ${{ forge.event_name == 'pull_request' }}

jobs:
  test:
    name: Run tests
    runs-on: home-linux-amd64
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: microdnf install --assumeyes tree-sitter-cli
      - name: Run tests
        run: tree-sitter test
